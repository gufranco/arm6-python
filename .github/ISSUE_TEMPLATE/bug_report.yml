name: Something is wrong
description: An instruction does the wrong thing, or nothing works at all
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This package is a processor and a loader for programs somebody else
        wrote. Almost everything reported against it turns out to be one of two
        things: the processor is fine and the image is not the one it was meant
        to be, or there is no image at all. The first field tells all of us
        which.

  - type: textarea
    id: doctor
    attributes:
      label: What the doctor says
      description: |
        Run this from the repository and paste every line, including the ones
        that did not pass. Those are the ones worth reading, so do not trim it.

        macOS and Linux:

            python3 -m arm6.doctor

        Windows, whichever of these resolves:

            python -m arm6.doctor
            py -3 -m arm6.doctor

        It reports the machine as well as the package, so most answers are in
        there already. If it will not run at all, say so here and paste whatever
        it printed instead.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For an instruction, give its encoding and the state it should leave.
      placeholder: "0x97c004 is JP with a 14-bit target, so pc should become 0x0001"
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: The exact output or the whole traceback, pasted rather than described.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: The shortest thing that shows it
      description: Python we can run as it stands, with no editing.
      render: python
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: The doctor output above is complete rather than trimmed
          required: true
        - label: I own any microcode I am naming, and I have attached none of it
          required: true
