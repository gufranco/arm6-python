---
name: Weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the newest tools, unpinned on purpose
        run: |
          python -m pip install --disable-pip-version-check \
            --upgrade ruff mypy coverage setuptools types-setuptools

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: mypy

      - name: Every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find arm6 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must still be total
        run: python -m coverage report

      - name: The model has not become several times slower
        run: python -m conformance.speed

      - name: Say what this run did not cover
        run: |
          echo "The recorded cases are not compared here: that runs on every"
          echo "push to main, against the commit conformance/suites.json pins."
        shell: bash
