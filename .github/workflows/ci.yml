name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON and YAML file is formatted
        run: pnpm run format:check

      # The workflows are the one thing here nothing else checks, and a mistake
      # in them is only visible once a run has already gone wrong. The archive
      # is verified by digest before anything in it runs, for the same reason
      # every document this project reads is.
      - name: Check the workflows themselves
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the version offers turned on. A
      # model of a processor is arithmetic on masked integers end to end, and a
      # checker that sees the whole register file is the cheapest place to catch a
      # width or a sign crossing a boundary it should not. The settings live in
      # pyproject.toml so a local run and this one agree.
      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" -v || status=1
            echo "::endgroup::"
          done < <(find arm6 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      # No document is redistributable, so none is here and this checks nothing
      # on a runner. It says so rather than reporting a pass: the value is that
      # somebody running it with the datasheet on disk gets a real answer, and
      # that a run without it cannot be mistaken for one.
      - name: Every quoted sentence, against the page it came from
        run: python -m conformance.quotes

      # Uninstrumented, and deliberately after the coverage run rather than
      # inside it. A coverage tracer costs about ten times what the model does, so
      # a throughput check under one measures the tracer.
      - name: The model has not become several times slower
        run: python -m conformance.speed

  conformance:
    name: Conformance against the recorded cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Keyed by the file that pins the commit and names the filter, so a change
      # to either fetches again rather than comparing against the old cases.
      - name: Cache the recorded cases
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/arm7tdmi
          key: arm7tdmi-${{ hashFiles('conformance/suites.json') }}

      # Only the files the filter keeps are fetched. The other seven describe
      # encodings this part has no row for, so fetching them would be a third of
      # a gigabyte to throw away.
      - name: Fetch the recorded cases
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          repository=$(python -c "import json;print(json.load(open('conformance/suites.json'))['suites'][0]['repository'])")
          commit=$(python -c "import json;print(json.load(open('conformance/suites.json'))['suites'][0]['commit'])")
          mkdir -p ~/.cache/arm7tdmi
          git init -q ~/.cache/arm7tdmi
          git -C ~/.cache/arm7tdmi remote add origin "${repository}"
          git -C ~/.cache/arm7tdmi config core.sparseCheckout true
          git -C ~/.cache/arm7tdmi sparse-checkout init --no-cone
          python -m conformance.singlestep --files > ~/.cache/arm7tdmi/.git/info/sparse-checkout
          git -C ~/.cache/arm7tdmi fetch --depth=1 --filter=blob:none origin "${commit}"
          git -C ~/.cache/arm7tdmi checkout -q FETCH_HEAD
        shell: bash

      # A pull request runs a slice of each file for a quick answer. A push to
      # main runs every case, because the number of them is what the claim rests
      # on.
      - name: Compare against every case the filter keeps
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            python -m conformance.singlestep ~/.cache/arm7tdmi/v1 --limit 2000
          else
            python -m conformance.singlestep ~/.cache/arm7tdmi/v1
          fi
        shell: bash
