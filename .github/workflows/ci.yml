---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON and YAML file is formatted
        run: pnpm run format:check

      - name: Check the workflows, with actionlint verified by digest
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker and the build backend's stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" -v || status=1
            echo "::endgroup::"
          done < <(find arm6 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      - name: Every quoted sentence, against the page it came from, where present
        run: python -m conformance.quotes

      - name: The model has not become several times slower, outside coverage
        run: python -m conformance.speed

  conformance:
    name: Conformance against the recorded cases
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache the recorded cases
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/arm7tdmi
          key: arm7tdmi-${{ hashFiles('conformance/suites.json') }}

      - name: Fetch the recorded cases
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          suite=$(python - <<'PY'
          import json
          with open("conformance/suites.json") as held:
              chosen = json.load(held)["suites"][0]
          print(chosen["repository"])
          print(chosen["commit"])
          PY
          )
          { read -r repository; read -r commit; } <<< "${suite}"
          mkdir -p ~/.cache/arm7tdmi
          git init -q ~/.cache/arm7tdmi
          git -C ~/.cache/arm7tdmi remote add origin "${repository}"
          git -C ~/.cache/arm7tdmi config core.sparseCheckout true
          git -C ~/.cache/arm7tdmi sparse-checkout init --no-cone
          python -m conformance.singlestep --files > ~/.cache/arm7tdmi/.git/info/sparse-checkout
          git -C ~/.cache/arm7tdmi fetch --depth=1 --filter=blob:none origin "${commit}"
          git -C ~/.cache/arm7tdmi checkout -q FETCH_HEAD
        shell: bash

      - name: Compare against the cases the filter keeps, a slice on a pull request
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            python -m conformance.singlestep ~/.cache/arm7tdmi/v1 --limit 2000
          else
            python -m conformance.singlestep ~/.cache/arm7tdmi/v1
          fi
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/arm6-*.whl
